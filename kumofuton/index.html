<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kumofuton</title>
<link rel="stylesheet" href="/kumofuton/assets/style.css">
<script>
(function () {
  var langs = navigator.languages || [navigator.language || "en"];
  var pick = "en";
  for (var i = 0; i < langs.length; i++) {
    var l = langs[i].toLowerCase();
    if (l.indexOf("zh") === 0) {
      pick = /hant|tw|hk|mo/.test(l) ? "zh-hant" : "zh-hans"; break;
    }
    var base = l.split("-")[0];
    if (["en", "ja", "ko", "fr", "de", "ar"].indexOf(base) !== -1) { pick = base; break; }
  }
  location.replace("/kumofuton/" + pick + "/");
})();
</script>
</head>
<body><main><h1>Kumofuton</h1><ul class="language-list"><li><a href="/kumofuton/en/" lang="en">English</a></li><li><a href="/kumofuton/ja/" lang="ja">日本語</a></li><li><a href="/kumofuton/ko/" lang="ko">한국어</a></li><li><a href="/kumofuton/zh-hans/" lang="zh-Hans">简体中文</a></li><li><a href="/kumofuton/zh-hant/" lang="zh-Hant">繁體中文</a></li><li><a href="/kumofuton/fr/" lang="fr">Français</a></li><li><a href="/kumofuton/de/" lang="de">Deutsch</a></li><li><a href="/kumofuton/ar/" lang="ar">العربية</a></li></ul></main></body>
</html>
